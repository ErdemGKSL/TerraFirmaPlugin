# tfp: block state templates. Pools are placeholders until the visual allocator (M1-DGN-04) assigns them.
templates#block_states:
  # Single-state full cube using an existing model.
  tfp:block_state/cube:
    auto_state: solid
    model: ${cube_model}
  # TFC raw/hardened rock: axis property, each axis picks the model or its mirrored twin at random.
  # Must stay identical to CeBlockStates.expandRandomPillar (a datagen test compares them).
  tfp:block_state/random_pillar:
    properties:
      axis:
        type: axis
        default: y
    appearances:
      axis_x:
        auto_state: solid
        models:
          - path: ${pillar_model}
            x: 90
            y: 90
          - path: ${pillar_model_mirrored}
            x: 90
            y: 90
      axis_y:
        auto_state: solid
        models:
          - path: ${pillar_model}
          - path: ${pillar_model_mirrored}
          - path: ${pillar_model}
            y: 180
          - path: ${pillar_model_mirrored}
            y: 180
      axis_z:
        auto_state: solid
        models:
          - path: ${pillar_model}
            x: 90
          - path: ${pillar_model_mirrored}
            x: 90
          - path: ${pillar_model}
            x: 90
            y: 180
          - path: ${pillar_model_mirrored}
            x: 90
            y: 180
    variants:
      axis=x:
        appearance: axis_x
      axis=y:
        appearance: axis_y
      axis=z:
        appearance: axis_z
