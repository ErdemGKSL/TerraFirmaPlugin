# tfp: item templates.
templates#items:
  # Item that places the block with the same id. item_lang_key: client translation key (TFC's, renamed).
  tfp:item/block_item:
    material: paper
    data:
      item_name: <!i><lang:${item_lang_key}>
    model: ${__NAMESPACE__}:item/${__ID__}
    behavior:
      type: block_item
      block: ${__NAMESPACE__}:${__ID__}
  # Plain item (block drops such as ore pieces and loose rocks, until their own features land).
  tfp:item/simple:
    material: paper
    data:
      item_name: <!i><lang:${item_lang_key}>
    model: ${__NAMESPACE__}:item/${__ID__}
  # Edible TFC food. nutrition: the TFC hunger (vanilla food points); the eating rules come from TFC's food data, not from this.
  tfp:item/food:
    material: apple
    data:
      item_name: <!i><lang:${item_lang_key}>
    model: ${__NAMESPACE__}:item/${__ID__}
    settings:
      food:
        nutrition: ${nutrition}
        saturation: 0
  # Metal mining tool (M4-TOOL-02 data slice). material: the vanilla tool whose hand rendering and enchantability it takes.
  # durability, speed, break_power: the TFC tier (TFCTiers). mineable_tag: the block tag the tool mines faster.
  # tool_tag: the CE item tag used with the blocks' correct_tools. Attack damage and the non-mining tools are open.
  tfp:item/tool:
    material: ${material}
    data:
      item_name: <!i><lang:${item_lang_key}>
      max_stack_size: 1
      max_damage: ${durability}
      tool:
        rules:
          - blocks: "#${mineable_tag}"
            speed: ${speed}
            correct_for_drops: true
        default_mining_speed: 1.0
        damage_per_block: 1
    model: ${__NAMESPACE__}:item/${__ID__}
    settings:
      break_power: ${break_power}
      tags:
        - ${tool_tag}
  # Metal sword and mace. damage: the attack_damage modifier amount (TFC damage x factor - 1: a CE item with attribute_modifiers
  # replaces the vanilla base damage, so the in-game damage is 1 + amount). The attack speed is open.
  tfp:item/weapon:
    material: iron_sword
    data:
      item_name: <!i><lang:${item_lang_key}>
      max_stack_size: 1
      max_damage: ${durability}
      attribute_modifiers:
        - type: attack_damage
          amount: ${damage}
          operation: add_value
          slot: mainhand
    model: ${__NAMESPACE__}:item/${__ID__}
    settings:
      break_power: ${break_power}
