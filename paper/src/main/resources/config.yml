# TerraFirmaPlugin configuration.
# Missing top-level sections are added back with their defaults on startup; your edits and comments
# are kept. Apply changes with /tfp reload config (some keys only take effect after a restart).

# Client visuals: how TFC blocks are mapped onto the block states vanilla clients know.
# profile: per Minecraft version family. level-0 | level-1 | level-2.
#   Higher levels share more visuals (e.g. wood axes, deposits) and leave more CraftEngine states
#   free for other packs; lower levels look closer to TFC. Ores always take their host rock's look
#   with the ore drawn on exposed faces (ore-overlay below), so ore grades stay distinct in every
#   level. level-3a and level-3b were removed; they are read as level-2 with a warning.
#   Changing it needs a restart.
# solid-reserve-warning: warn at startup if fewer free solid-pool slots remain for other CraftEngine packs.
# use-nether-end-blocks: auto | true | false. auto = repurpose Nether/End blocks only if the server
#   has no vanilla Nether/End (allow-nether / allow-end off).
visuals:
  profile:
    "1.21": level-2
    "26": level-2
  solid-reserve-warning: 500
  use-nether-end-blocks: auto

# Ore face overlays: the ore texture is drawn only on faces a player can see.
# cutoff-blocks: how far (in blocks) an overlay is drawn; overlays are sent for chunks within
#   ceil(cutoff-blocks / 16) + 1 chunks of the player.
# max-per-player: most overlays one player is sent at once (nearest first).
# surface-outcrops-full-range: ore faces at the surface (cliffs, outcrops) are drawn within the
#   full view distance, like TFC, so surface prospecting works.
ore-overlay:
  cutoff-blocks: 48
  max-per-player: 8000
  surface-outcrops-full-range: true

# Automatic setup of CraftEngine, BetterModel and BetterHud.
# craftengine / betterhud: write our content into plugins/CraftEngine/resources/tfp and
#   plugins/BetterHud/packs/tfp. Files you edited are kept (ours is written beside them as .tfp-new).
# config-edits: apply the few config changes we need in those plugins (each one is logged).
# download-missing: download missing client plugins (pinned versions, hash-checked). Off by default:
#   downloading code needs your explicit consent.
# restore-deleted: recreate files of ours that you deleted.
auto-install:
  craftengine: true
  betterhud: true
  config-edits: true
  download-missing: false
  restore-deleted: false

# Catch-up of time-based blocks (crops, devices, ...). TFC checks every block entity each tick for a
# calendar jump (checkForCalendarUpdate); we instead catch a block up when its chunk loads, when it is
# used or broken, and by a periodic sweep of the chunks around players. Changes need a restart.
# sweep-period-ticks: server ticks between sweeps (600 = 30 s); 0 turns the sweep off (load and use
#   still catch blocks up).
# sweep-radius-chunks: chunks around each player the sweep covers (0..32).
# feed-budget-micros: region-thread time per tick for reading blocks to catch up, in microseconds (1..50000).
# commit-budget-micros: region-thread time per tick for writing caught-up blocks, in microseconds (1..50000).
# The JVM properties -Dtfp.catchup.sweepPeriodTicks, sweepRadiusChunks, feedBudgetMicros and
# commitBudgetMicros override these keys.
catchup:
  sweep-period-ticks: 600
  sweep-radius-chunks: 4
  feed-budget-micros: 1000
  commit-budget-micros: 1000
