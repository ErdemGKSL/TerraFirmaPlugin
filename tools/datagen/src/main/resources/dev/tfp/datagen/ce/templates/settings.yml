# tfp: block settings templates (re-authored for this project; no CraftEngine default: templates are used).
# Argument names carry their template's domain as prefix, because the caller's argument always wins.
templates#settings:
  # Full opaque cube: suffocates, blocks view, conducts redstone, occludes.
  tfp:settings/solid_cube:
    is_suffocating: true
    is_view_blocking: true
    is_redstone_conductor: true
    can_occlude: true
    replaceable: false
  # Vanilla sound group by block type name (stone, gravel, sand, grass, ...). Blocks are silent without it.
  tfp:settings/sound:
    sounds:
      break: minecraft:block.${sound_block_type}.break
      step: minecraft:block.${sound_block_type}.step
      place: minecraft:block.${sound_block_type}.place
      hit: minecraft:block.${sound_block_type}.hit
      fall: minecraft:block.${sound_block_type}.fall
  # Rock-like blocks (raw/hardened/cobble/bricks/smooth/..., ores, magma): stone sounds, pickaxe required for drops.
  # rock_hardness, rock_resistance: numbers. rock_map_color: vanilla MapColor id. rock_luminance: 0-15.
  tfp:settings/rock:
    template:
      - tfp:settings/sound
      - tfp:settings/solid_cube
    arguments:
      sound_block_type: stone
    overrides:
      hardness: ${rock_hardness}
      resistance: ${rock_resistance}
      luminance: ${rock_luminance:-0}
      instrument: basedrum
      map_color: ${rock_map_color}
      tags:
        - minecraft:mineable/pickaxe
      # CE expands a tag to its vanilla members plus the CE items whose settings.tags list it; the TFC metal pickaxes
      # (tfp:item/tool) carry only tfp:tools/pickaxe, so both tags are needed (PAR-INFRA-27).
      correct_tools:
        - '#minecraft:pickaxes'
        - '#tfp:tools/pickaxe'
  # Natural stone-like full blocks (sandstones, hardened clay, halite, coal; PAR-DECO-08): pickaxe for drops, strength() sets
  # hardness and resistance alike. natural_hardness: number. natural_instrument: note block instrument.
  tfp:settings/natural_stone:
    template:
      - tfp:settings/sound
      - tfp:settings/solid_cube
    overrides:
      hardness: ${natural_hardness}
      resistance: ${natural_resistance}
      instrument: ${natural_instrument}
      map_color: ${natural_map_color}
      tags:
        - minecraft:mineable/pickaxe
      correct_tools:
        - '#minecraft:pickaxes'
        - '#tfp:tools/pickaxe'
  # Aggregate (PAR-DECO-07): shovel-mineable full block, no tool required. Same arguments as natural_stone.
  tfp:settings/natural_shovel:
    template:
      - tfp:settings/sound
      - tfp:settings/solid_cube
    overrides:
      hardness: ${natural_hardness}
      resistance: ${natural_resistance}
      instrument: ${natural_instrument}
      map_color: ${natural_map_color}
      tags:
        - minecraft:mineable/shovel
  # Wood blocks (logs, wood, stripped, planks; PAR-WORLD-10): wood sounds, axe-mineable.
  # wood_hardness, wood_resistance: numbers. wood_map_color: vanilla MapColor id. wood_instrument: note block instrument name.
  # wood_correct_tools: the tool tags that count as correct (an empty list for planks, which need no tool).
  tfp:settings/wood:
    template:
      - tfp:settings/sound
      - tfp:settings/solid_cube
    arguments:
      sound_block_type: wood
    overrides:
      hardness: ${wood_hardness}
      resistance: ${wood_resistance}
      instrument: ${wood_instrument}
      map_color: ${wood_map_color}
      tags:
        - minecraft:mineable/axe
  # Wood blocks that need an axe or saw for drops (logs, wood and their stripped forms).
  tfp:settings/wood_tool:
    template: tfp:settings/wood
    overrides:
      correct_tools:
        - '#minecraft:axes'
        - '#tfp:tools/axe'
        - '#tfp:tools/saw'
  # Leaves (PAR-WORLD-10): grass sounds, not a cube, no tool required; sharp tools mine them faster (minecraft:mineable/hoe).
  tfp:settings/leaves:
    template: tfp:settings/sound
    arguments:
      sound_block_type: grass
    overrides:
      hardness: 0.5
      resistance: 0.5
      instrument: harp
      map_color: 7
      is_suffocating: false
      is_view_blocking: false
      can_occlude: false
      replaceable: false
      tags:
        - minecraft:mineable/hoe
        - minecraft:leaves
  # Loose granular blocks (dirt, clay, sand, gravel): shovel-mineable, no tool required.
  # sound_block_type: gravel|sand|grass. granular_instrument: note block instrument name.
  tfp:settings/granular:
    template:
      - tfp:settings/sound
      - tfp:settings/solid_cube
    overrides:
      hardness: ${granular_hardness}
      resistance: ${granular_resistance}
      instrument: ${granular_instrument}
      map_color: ${granular_map_color}
      tags:
        - minecraft:mineable/shovel
  # Devices (charcoal forge, bellows): stone sounds, not a full cube, no tool required. device_hardness, device_resistance: numbers.
  tfp:settings/device:
    template: tfp:settings/sound
    arguments:
      sound_block_type: stone
    overrides:
      hardness: ${device_hardness}
      resistance: ${device_resistance}
      instrument: basedrum
      tags:
        - minecraft:mineable/pickaxe
