# TerraFirmaPlugin configuration.
# Missing top-level sections are added back with their defaults on startup; your edits and comments
# are kept. Apply changes with /tfp reload config (some keys only take effect after a restart).

# Client visuals: how TFC blocks are mapped onto the block states vanilla clients know.
# profile: per Minecraft version family. level-0 | level-1 | level-2.
#   Higher levels share more visuals (e.g. wood axes, deposits) and leave more CraftEngine states
#   free for other packs; lower levels look closer to TFC. Ores always take their host rock's look
#   with the ore drawn on exposed faces (ore-overlay below), so ore grades stay distinct in every
#   level. level-3a and level-3b were removed; they are read as level-2 with a warning.
#   Changing it needs a restart.
# solid-reserve-warning: warn at startup if fewer free solid-pool slots remain for other CraftEngine packs.
# use-nether-end-blocks: auto | true | false. auto = repurpose Nether/End blocks only if the server
#   has no vanilla Nether/End (allow-nether / allow-end off).
visuals:
  profile:
    "1.21": level-2
    "26": level-2
  solid-reserve-warning: 500
  use-nether-end-blocks: auto

# Ore face overlays: the ore texture is drawn only on faces a player can see.
# cutoff-blocks: how far (in blocks) an overlay is drawn; overlays are sent for chunks within
#   ceil(cutoff-blocks / 16) chunks of the player (40 -> 3 chunks; 48 or more raises the overlay
#   count above 8000 per player near rich veins in caves).
# max-per-player: most overlays one player is sent at once (nearest first).
# surface-outcrops-full-range: ore faces at the surface (cliffs, outcrops) are drawn within the
#   full view distance, like TFC, so surface prospecting works.
ore-overlay:
  cutoff-blocks: 40
  max-per-player: 8000
  surface-outcrops-full-range: true

# Automatic setup of CraftEngine, BetterModel and BetterHud.
# craftengine / betterhud: write our content into plugins/CraftEngine/resources/tfp and
#   plugins/BetterHud/packs/tfp. Files you edited are kept (ours is written beside them as .tfp-new).
# config-edits: apply the few config changes we need in those plugins (each one is logged).
# download-missing: download missing client plugins (pinned versions, hash-checked). Off by default:
#   downloading code needs your explicit consent.
# restore-deleted: recreate files of ours that you deleted.
auto-install:
  craftengine: true
  betterhud: true
  config-edits: true
  download-missing: false
  restore-deleted: false

# Catch-up of time-based blocks (crops, devices, ...). TFC checks every block entity each tick for a
# calendar jump (checkForCalendarUpdate); we instead catch a block up when its chunk loads, when it is
# used or broken, and by a periodic sweep of the chunks around players. Changes need a restart.
# sweep-period-ticks: server ticks between sweeps (600 = 30 s); 0 turns the sweep off (load and use
#   still catch blocks up).
# sweep-radius-chunks: chunks around each player the sweep covers (0..32).
# feed-budget-micros: region-thread time per tick for reading blocks to catch up, in microseconds (1..50000).
# commit-budget-micros: region-thread time per tick for writing caught-up blocks, in microseconds (1..50000).
# The JVM properties -Dtfp.catchup.sweepPeriodTicks, sweepRadiusChunks, feedBudgetMicros and
# commitBudgetMicros override these keys.
catchup:
  sweep-period-ticks: 600
  sweep-radius-chunks: 4
  feed-budget-micros: 1000
  commit-budget-micros: 1000

# HUD display styles. TFC sets these per player in its client config; vanilla clients have none, so one
# value here applies to every player. Apply changes with /tfp reload config.
# health-display-style: health display format. This affects what number is displayed on top of the
#   tfc-style health bar.
#   TFC - e.g. 750/1000
#   VANILLA - e.g. 15.0/20.0
#   TFC_CURRENT - e.g. 750
#   VANILLA_CURRENT - e.g. 15.0
# climate-temperature-style: the style to display all external (i.e. climate) temperature in.
#   CELSIUS = Exact degrees Celsius
#   FAHRENHEIT = Exact degrees Fahrenheit
#   KELVIN = Exact Kelvin
#   RANKINE = Exact degrees Rankine
# enable-experience-bar: allows the vanilla XP bar to render. false is not supported yet: the vanilla
#   XP bar stays and a warning is logged.
# disabled-experience-bar-style: the style to display HUD elements when the XP bar is disabled.
#   HOVER | BUMP | LEFT_HOTBAR. Has no effect until enable-experience-bar false is supported.
hud:
  health-display-style: TFC
  climate-temperature-style: CELSIUS
  enable-experience-bar: true
  disabled-experience-bar-style: HOVER

# Buckets (TFC server config "buckets"). Apply changes with /tfp reload config.
# wooden-bucket-can-place-sources: If true, a wooden bucket can place source blocks
# metal-bucket-can-place-sources: If true, a metal (red and blue steel) bucket can place source blocks
# When false, an emptied bucket places a small flowing block that dries up.
# TFC's woodenBucketCapacity and metalBucketCapacity are not configurable here: both stay 1000 mB.
buckets:
  wooden-bucket-can-place-sources: false
  metal-bucket-can-place-sources: false

# Survival (TFC server config). Apply changes with /tfp reload config.
# keep-nutrition-after-death: If player's nutrition should be kept even after death. Hunger and thirst
#   are not affected and will be reset.
# peaceful-passive-regeneration: If peaceful difficulty should still have vanilla-esque passive
#   regeneration of health, food, and hunger (TFC enablePeacefulDifficultyPassiveRegeneration).
# natural-regeneration-modifier: A multiplier for how quickly the player regenerates health, under
#   TFC's passive regeneration. By default, the player regenerates 0.2 HP/second, or 0.6 HP/second
#   when above 80% hunger and thirst, where 1 HP = 1/50 of a heart. 0..100.
survival:
  keep-nutrition-after-death: true
  peaceful-passive-regeneration: false
  natural-regeneration-modifier: 1.0

# Item bars (TFC client config). TFC sets this per player; vanilla clients have none, so one value here
# applies to every player. Apply changes with /tfp reload config.
# heat: If true, for items that are hot, they will show a bar on the item like a durability bar
item-bars:
  heat: true

# Device automation (TFC server config *EnableAutomation). Hoppers, droppers and hopper minecarts feed and empty
# these devices through the sides TFC's sided handlers give them. Apply changes with /tfp reload config: the next
# hopper move reads the new value.
# barrel: barrelEnableAutomation. fire-pit: firePitEnableAutomation (the firepit, grill and pot).
# quern: quernEnableAutomation. composter: composterEnableAutomation. powder-keg: powderKegEnableAutomation.
automation:
  barrel: true
  fire-pit: true
  quern: true
  composter: true
  powder-keg: true

# Bloomery (TFC server config bloomeryCapacity and bloomeryMaxChimneyHeight). Apply changes with /tfp reload config.
# capacity: items a bloomery holds per level of chimney (TFC default 16, at least 1; at most 128 here, the slots of its record).
# max-chimney-height: the most chimney levels that add capacity (TFC default 3, at least 1; at most 16 here).
bloomery:
  capacity: 16
  max-chimney-height: 3

# Blast furnace (TFC server config blastFurnaceCapacity, blastFurnaceMaxChimneyHeight, blastFurnaceFluidCapacity and
# blastFurnaceFuelConsumptionMultiplier). Apply changes with /tfp reload config.
# capacity: items of each kind (inputs, fluxes, fuel) a blast furnace holds per level of chimney (TFC default 4, at least 1).
# max-chimney-height: the most chimney levels that add capacity (TFC default 5, at least 1). capacity x max-chimney-height is
#   at most 32 here (the slots of its record); otherwise both fall back to the defaults.
# fluid-capacity: mB the output tank holds (TFC default 10000, at least 1); what no container takes is lost when it is full.
# fuel-consumption-multiplier: how fast the fuel burns (TFC default 4, at least 1; air from bellows doubles it).
blast-furnace:
  capacity: 4
  max-chimney-height: 5
  fluid-capacity: 10000
  fuel-consumption-multiplier: 4

# Pit kiln (TFC server config pitKilnTicks and pitKilnTemperature). Apply changes with /tfp reload config.
# ticks: how many ticks a lit pit kiln burns before it is done (TFC default 7200, six minutes; at least 20).
#   The kiln runs on the calendar, so time while its chunk is unloaded counts.
# temperature: the temperature in degrees Celsius a kiln heats its contents to (TFC default 1400, at least 0).
pit-kiln:
  ticks: 7200
  temperature: 1400
