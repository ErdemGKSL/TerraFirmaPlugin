# PAR-REL-02: JMH performance budgets. Fails when a benchmark is more than 20 % above its budget in core/src/jmh/budgets.json,
# unless the PR description has a line starting with "perf-note:" (the reason). Shared runners are noisy: one rerun is allowed.
name: Perf

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Perf note in PR description?
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -qiE '^perf-note:'; then echo "TFP_PERF_NOTE=1" >> "$GITHUB_ENV"; fi
      - name: JMH and budget check (one retry on noise)
        run: ./gradlew :core:jmhCheck || ./gradlew :core:jmhCheck
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: core/build/reports/jmh/results.json
          if-no-files-found: warn
